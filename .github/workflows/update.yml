name: update

on:
  schedule:
    - cron: "23 * * * *"     # hourly: new lines, scores, picks (sportsbook odds on their own budget)
    - cron: "41 9 * * 1"     # Mondays: re-tune parameters and rerun the backtest
  workflow_dispatch:
    inputs:
      mode:
        description: "update, tune, or backtest"
        default: update

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # a new sport's first run backfills ~3 seasons of ESPN data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run model
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "41 9 * * 1" ]; then MODE=tune; fi
          python -W ignore -m cbb.run "${MODE:-update}"
          if [ "$MODE" = "diag" ]; then git checkout -- data docs 2>/dev/null || true; fi
      - name: Commit data and site
        run: |
          git config user.name "cbb-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "update $(date -u +%FT%H:%MZ)"
          git pull --rebase -X theirs origin main   # code may have been pushed during the run
          git push
